server {
    listen 80;
    listen [::]:80;
    server_name smart4k.io www.smart4k.io;
    return 301 https://smart4k.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.smart4k.io;
    ssl_certificate /etc/letsencrypt/live/smart4k.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart4k.io/privkey.pem;
    return 301 https://smart4k.io$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name smart4k.io;
    ssl_certificate /etc/letsencrypt/live/smart4k.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart4k.io/privkey.pem;

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name checkout.smart4k.io;
    root /var/www/checkout.smart4k.io;
    index index.php index.html index.htm;
    
    # We leave HTTP only for now; Cloudflare proxy provides the HTTPS layer usually
    # If the user has strict origin, we will need to request letsencrypt later, 
    # but for now port 80 with Cloudflare Flexible/Full works.

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
